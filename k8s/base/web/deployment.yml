# base/web/deployment.yml
# Web — nginx:1.27-alpine со статикой Vite (dist/web).
# Проксирует /__api/ → api-svc:3000 (см. docker/nginx.conf).
#
# v0.0.02:
#   - containerPort / probe port: 80 → 8080. nginx запускается как non-root
#     (runAsNonRoot: true, runAsUser: 101) и не может биндиться на порт < 1024
#     (нужен CAP_NET_BIND_SERVICE, которого нет). nginx.conf слушает 8080,
#     Service мапит 80 → 8080 (см. service.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: xartia
  labels: { app: web, xartia.io/tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      priorityClassName: xartia-default
      containers:
        - name: web
          image: xartia-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # nginxinc/nginx-unprivileged сам работает от uid 101.
            # runAsUser не указываем — образ сам обеспечивает не-root.