# ============================================================================
# I.3.05.10 — CronJob: ежедневное обнаружение квантов.
#
# Дёргает POST /quanta/process-daily. Право quantum:Act.
# Логика — в C.0.25.02 (processDaily): detectPotential + запись кандидатов
# в audit_log. Автосоздание квантов НЕ выполняется — решение за оператором
# (I.3.3.2).
#
# Расписание: 0 3 * * * — ежедневно в 03:00 UTC.
# Токен: сервисный участник К90005-01, Secret xartia-quanta-cron.
# ============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: quanta-process-daily
  namespace: xartia
  labels:
    app: xartia
    module: quanta
    cron-id: I.3.05.10
spec:
  schedule: "0 3 * * *"          # ежедневно в 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: xartia
            module: webhooks
        spec:
          restartPolicy: OnFailure
          containers:
            - name: process-daily
              image: curlimages/curl:8.10.1
              env:
                - name: API_URL
                  value: "http://api-svc:3000"
                - name: CRON_PHONE
                  valueFrom:
                    secretKeyRef:
                      name: xartia-quanta-cron
                      key: phone
                - name: CRON_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: xartia-quanta-cron
                      key: password
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "[cron] logging in as $CRON_PHONE"

                  login_response=$(curl -fsS \
                    -X POST "$API_URL/auth/login" \
                    -H "Content-Type: application/json" \
                    -d "{\"phone\":\"$CRON_PHONE\",\"password\":\"$CRON_PASSWORD\"}")

                  token=$(echo "$login_response" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  if [ -z "$token" ]; then
                    echo "[cron] ERROR: no access_token"
                    exit 1
                  fi

                  response=$(curl -fsS \
                    -X POST "$API_URL/quanta/process-daily" \
                    -H "Authorization: Bearer $token" \
                    -H "Content-Type: application/json" \
                    -d '{}')

                  echo "[cron] response: $response"

                  if echo "$response" | grep -q '"candidates"'; then
                    echo "[cron] OK"
                    exit 0
                  fi
                  echo "[cron] ERROR: unexpected response"
                  exit 1
              resources:
                requests: { cpu: "10m", memory: "16Mi" }
                limits:   { cpu: "100m", memory: "64Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000