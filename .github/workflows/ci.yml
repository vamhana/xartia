# CI — статическая проверка и smoke-тесты.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Значения только для CI: ключи фиксированные, не секреты.
  # ENCRYPTION_KEY / PHONE_HASH_KEY — base64 от 32 нулевых байт.
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  PHONE_HASH_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  INTEGRITY_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  JWT_SECRET: ci-only-secret-min-32-characters-long
  ARCHITECT_PHONE: '+79001234567'
  ARCHITECT_PASSWORD: ChangeMe123456
  ARCHITECT_NAME: CI Architect

jobs:
  static:
    name: Типы и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm typecheck
      - name: Build API (tsc)
        run: pnpm build
      - name: Build web (vite)
        run: pnpm exec vite build

  smoke:
    name: Smoke-тесты API
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: charter
          POSTGRES_PASSWORD: charter
          POSTGRES_DB: charter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NODE_ENV: test
      API_PORT: 3000
      API_URL: http://localhost:3000
      DATABASE_URL: postgresql://charter:charter@localhost:5432/charter
      DATABASE_REPLICA_URL: postgresql://charter:charter@localhost:5432/charter
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: 'false'
      # S3-клиент падает при импорте, если переменных нет (L.0.01.07).
      # В smoke-тестах S3 не используется — достаточно валидных значений.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio
      S3_SECRET_KEY: ci-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Артефакт отчёта — обязательная часть контура «задача → отчёт → ОТК»:
      # без хранилища smoke-тест задач падает на «Артефакт не сохранился».
      # Запускаем MinIO шагом, а не сервисом: образу нужен аргумент `server /data`,
      # а services в GitHub Actions не поддерживают command.
      - name: MinIO (хранилище артефактов)
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio \
            -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            coollabsio/minio:latest server /data
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO поднялся за ${i}s"
              break
            fi
            sleep 1
          done

      - name: Бакеты S3
        run: pnpm tsx scripts/ensure-buckets.ts

      # 017_seed_widgets.sql требует участника, поэтому миграции идут
      # в два прохода: схема → Архитектор → сиды.
      - name: Миграции (схема)
        run: pnpm db:migrate
      - name: Архитектор
        run: pnpm tsx scripts/ensure-architect.ts
      - name: Миграции (сиды)
        run: pnpm db:migrate

      - name: Запустить API
        run: |
          # Без watch: tsx watch рассчитан на интерактивную разработку и в CI
          # может вести себя иначе (нет TTY, другой слежение за файлами).
          pnpm exec tsx src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API поднялся за ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API не поднялся"
          tail -200 /tmp/api.log
          {
            echo '### Лог API (последние 200 строк)'
            echo '```'
            tail -200 /tmp/api.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Базовые справочники
        run: pnpm tsx scripts/seed-base.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD"

      - name: Smoke — система
        run: |
          set -o pipefail
          pnpm tsx scripts/test-system.ts 2>&1 | tee /tmp/smoke-test-system.log
      - name: Smoke — витрина
        run: |
          set -o pipefail
          pnpm tsx scripts/test-public.ts 2>&1 | tee /tmp/smoke-test-public.log
      - name: Smoke — регистрация
        run: |
          set -o pipefail
          pnpm tsx scripts/test-register.ts 2>&1 | tee /tmp/smoke-test-register.log
      - name: Smoke — паспорт
        run: |
          set -o pipefail
          pnpm tsx scripts/test-passport.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-passport.log
      - name: Smoke — коллектив
        run: |
          set -o pipefail
          pnpm tsx scripts/test-collective.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-collective.log
      - name: Smoke — роль при приёме
        run: |
          set -o pipefail
          pnpm tsx scripts/test-onboarding-role.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-onboarding-role.log
      - name: Smoke — путь участника
        run: |
          set -o pipefail
          pnpm tsx scripts/test-journey.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-journey.log
      - name: Smoke — сигнал → план
        run: |
          set -o pipefail
          pnpm tsx scripts/test-signal-plan.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-signal-plan.log
      - name: Smoke — отклонения плана
        run: |
          set -o pipefail
          pnpm tsx scripts/test-plan-deviation.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-plan-deviation.log
      - name: Smoke — ветки и приёмка ОТК
        run: |
          set -o pipefail
          pnpm tsx scripts/test-branches-otc.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-branches-otc.log
      - name: Smoke — дерево и наряд
        run: |
          set -o pipefail
          pnpm tsx scripts/test-tree-naryad.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-tree-naryad.log
      - name: Smoke — казна
        run: |
          set -o pipefail
          pnpm tsx scripts/test-treasury.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-treasury.log
      - name: Smoke — Совет направления
        run: |
          set -o pipefail
          pnpm tsx scripts/test-council.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-council.log
      - name: Smoke — передача наряда
        run: |
          set -o pipefail
          pnpm tsx scripts/test-delegation.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-delegation.log
      - name: Smoke — Шлюз
        run: |
          set -o pipefail
          pnpm tsx scripts/test-gateway.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-gateway.log
      - name: Smoke — уведомления
        run: |
          set -o pipefail
          pnpm tsx scripts/test-notification-link.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-notification-link.log
      - name: Smoke — задачи
        run: |
          set -o pipefail
          pnpm tsx scripts/test-tasks.ts "$ARCHITECT_PHONE" "$ARCHITECT_PASSWORD" 2>&1 | tee /tmp/smoke-test-tasks.log

      - name: Логи API при падении
        if: failure()
        run: |
          tail -200 /tmp/api.log || true
          {
            echo '### Причина падения (строки ✗ из smoke-логов)'
            echo '```'
            grep -h '✗' /tmp/smoke-*.log 2>/dev/null | head -10 || echo '(✗ не найдены)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Аннотация видна через API без доступа к логам — по ней понятно,
          # какой шаг и какая проверка упали.
          grep -h '✗' /tmp/smoke-*.log 2>/dev/null | head -5 | while IFS= read -r line; do
            echo "::error title=Smoke::${line}"
          done
          # Хвост лога упавшей проверки: там ответ API (status + тело), по
          # которому видно причину без доступа к полному логу джоба.
          FAILED_LOG=$(grep -l '✗' /tmp/smoke-*.log 2>/dev/null | head -1)
          if [ -n "$FAILED_LOG" ]; then
            echo "::notice title=FailedLog::${FAILED_LOG}"
            tail -25 "$FAILED_LOG" | tr -d '\r' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Log::${line}"
            done
          fi
          # Состояние S3/MinIO: если артефакт не сохраняется, причина обычно здесь.
          if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
            echo "::notice title=S3::MinIO health OK"
          else
            echo "::error title=S3::MinIO health FAILED (http://localhost:9000/minio/health/live)"
          fi
          docker ps --format '{{.Names}} {{.Status}}' | head -5 | while IFS= read -r line; do
            echo "::notice title=Docker::${line}"
          done
          grep -hiE 's3|artifact|PutObject|SignatureDoesNotMatch|AccessDenied|ECONNREFUSED|ETIMEDOUT' /tmp/api.log 2>/dev/null | tail -6 | while IFS= read -r line; do
            echo "::error title=API::${line}"
          done

