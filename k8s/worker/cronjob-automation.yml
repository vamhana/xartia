# ============================================================================
# I.3.05.07 — CronJob: ежедневный аудит операторов Automation.
#
# Дёргает POST /automation/run-daily-audit. Право automation:Act.
# Логика — в C.0.32.02 (runDailyAudit).
#
# Расписание: 0 4 * * * — ежедневно в 04:00 UTC (через час после Psy).
# Токен: сервисный участник К00002-12, Secret xartia-automation-cron.
# ============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: automation-run-daily-audit
  namespace: xartia
  labels:
    app: xartia
    module: automation
    cron-id: I.3.05.07
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300     # аудит может быть дольше (обход операторов)
      template:
        metadata:
          labels:
            app: xartia
            module: webhooks
        spec:
          restartPolicy: OnFailure
          containers:
            - name: run-daily-audit
              image: curlimages/curl:8.10.1
              env:
                - name: API_URL
                  value: "http://api-svc:3000"
                - name: CRON_PHONE
                  valueFrom:
                    secretKeyRef:
                      name: xartia-automation-cron
                      key: phone
                - name: CRON_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: xartia-automation-cron
                      key: password
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "[cron] logging in as $CRON_PHONE"

                  login_response=$(curl -fsS \
                    -X POST "$API_URL/auth/login" \
                    -H "Content-Type: application/json" \
                    -d "{\"phone\":\"$CRON_PHONE\",\"password\":\"$CRON_PASSWORD\"}")

                  token=$(echo "$login_response" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  if [ -z "$token" ]; then
                    echo "[cron] ERROR: no access_token in login response"
                    exit 1
                  fi

                  echo "[cron] token acquired, calling /automation/run-daily-audit"

                  response=$(curl -fsS \
                    -X POST "$API_URL/automation/run-daily-audit" \
                    -H "Authorization: Bearer $token" \
                    -H "Content-Type: application/json" \
                    -d '{}')

                  echo "[cron] response: $response"

                  # Формат ответа: {"audited":N,"removed":M,"audit_id":"..."}
                  if echo "$response" | grep -q '"audited"'; then
                    echo "[cron] OK"
                    exit 0
                  else
                    echo "[cron] ERROR: unexpected response"
                    exit 1
                  fi
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000