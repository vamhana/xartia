# ============================================================================
# I.3.05.09 — CronJob: ежедневная автокластеризация сигналов.
#
# Дёргает POST /aggregator/process-daily. Право aggregator:Act.
# Логика — в C.0.33.02 (processDaily).
#
# Расписание: 0 2 * * * — ежедневно в 02:00 UTC.
# Токен: сервисный участник Г90004-01, Secret xartia-aggregator-cron.
# ============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: aggregator-process-daily
  namespace: xartia
  labels:
    app: xartia
    module: aggregator
    cron-id: I.3.05.09
spec:
  schedule: "0 2 * * *"          # ежедневно в 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600   # кластеризация может быть дольше (TF-IDF)
      template:
        metadata:
          labels:
            app: xartia
            module: webhooks
        spec:
          restartPolicy: OnFailure
          containers:
            - name: process-daily
              image: curlimages/curl:8.10.1
              env:
                - name: API_URL
                  value: "http://api-svc:3000"
                - name: CRON_PHONE
                  valueFrom:
                    secretKeyRef:
                      name: xartia-aggregator-cron
                      key: phone
                - name: CRON_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: xartia-aggregator-cron
                      key: password
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "[cron] logging in as $CRON_PHONE"

                  login_response=$(curl -fsS \
                    -X POST "$API_URL/auth/login" \
                    -H "Content-Type: application/json" \
                    -d "{\"phone\":\"$CRON_PHONE\",\"password\":\"$CRON_PASSWORD\"}")

                  token=$(echo "$login_response" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  if [ -z "$token" ]; then
                    echo "[cron] ERROR: no access_token"
                    exit 1
                  fi

                  response=$(curl -fsS \
                    -X POST "$API_URL/aggregator/process-daily" \
                    -H "Authorization: Bearer $token" \
                    -H "Content-Type: application/json" \
                    -d '{}')

                  echo "[cron] response: $response"

                  if echo "$response" | grep -q '"processed"'; then
                    echo "[cron] OK"
                    exit 0
                  fi
                  echo "[cron] ERROR: unexpected response"
                  exit 1
              resources:
                requests: { cpu: "10m", memory: "16Mi" }
                limits:   { cpu: "200m", memory: "128Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000