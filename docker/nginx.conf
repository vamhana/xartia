# docker/nginx.conf — serve Vite SPA + proxy /__api/ → api-svc:3000/
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (react-router): всё → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite dev использует /__api → :3000 (rewrite в vite.config.ts).
  # В K8s nginx проксирует так же. Trailing slash в proxy_pass
  # strips /__api/ prefix.
  location /__api/ {
    proxy_pass http://api-svc:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Static assets — long cache
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml application/xml+rss;
}