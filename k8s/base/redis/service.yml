apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: xartia-data
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: xartia-data
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }