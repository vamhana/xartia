# base/network/default-deny.yml
# Default-deny all ingress + egress в namespace.
# Применяется к xartia, xartia-data, xartia-gateway.
# После default-deny КАЖДЫЙ поток должен быть разрешён явно.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: xartia
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: xartia-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: xartia-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress